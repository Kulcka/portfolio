[pytest]
testpaths = tests
markers =
    excel: пересчёт книги в настоящем Excel через COM (нужны Windows и Microsoft Excel)
# faulthandler на Windows печатает даже обработанные исключения COM (0x800706BA при
# освобождении прокси Excel) — это шум pywin32, не ошибка теста.
addopts = -ra -p no:faulthandler
