# Словарь колонок для merge: каноническое название -> как оно встречается в файлах заказчика.
# Сравнение без учёта регистра, ё/е, пробелов и знаков препинания («Сумма, ₽» = «сумма»).
# Под новый заказ: скопируйте файл, допишите синонимы и передайте через --config.
# Порядок ключей = порядок колонок в итоговой таблице.

columns:
  ФИО: [фио, ф.и.о., контактное лицо, контакт, клиент, имя, имя клиента, name, full name, покупатель]
  Телефон: [телефон, тел, тел., номер телефона, моб. телефон, мобильный, phone, телефон клиента]
  Email: [email, e-mail, эл. почта, электронная почта, почта, mail, емейл]
  Город: [город, населённый пункт, населенный пункт, нас. пункт, city, регион доставки]
  ИНН: [инн, инн организации, инн клиента, inn]
  Дата обращения: [дата обращения, дата, дата заявки, дата заказа, date, создано]
  Сумма заказа: [сумма заказа, сумма, сумма руб, сумма ₽, сумма заявки, amount, итого]

# Если название не нашлось в словаре, ищем похожее (опечатки, «Телефон клиента:»).
# Порог 0–100: выше — строже. Нечёткие совпадения всегда перечисляются в отчёте.
fuzzy_threshold: 88
