[project]
name = "ai-docs-assistant"
version = "1.0.0"
description = "ИИ-консультант по документам компании: ответы со ссылками на источник, Telegram-бот, YandexGPT/GigaChat/OpenAI/локальные модели"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "snowballstemmer>=2.2",
    "httpx>=0.27",
    "aiogram>=3.4,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
docs-assistant = "docs_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docs_assistant*"]

[tool.setuptools.package-data]
docs_assistant = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
