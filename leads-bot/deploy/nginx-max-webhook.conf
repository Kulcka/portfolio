# Пример для MAX_MODE=webhook: MAX шлёт события только на HTTPS, порт 443,
# с сертификатом доверенного центра (самоподписанные не принимаются).
# nginx принимает HTTPS и передаёт запрос боту на 127.0.0.1:8080.
# Сертификат — например, Let's Encrypt (certbot --nginx -d bot.example.ru).

server {
    listen 443 ssl;
    server_name bot.example.ru;

    ssl_certificate     /etc/letsencrypt/live/bot.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.ru/privkey.pem;

    # Путь должен совпадать с путём в MAX_WEBHOOK_URL
    location /max/webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
}
