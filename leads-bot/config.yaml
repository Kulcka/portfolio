# Настройки бота приёма заявок.
# Секреты (токены, id чатов) сюда НЕ пишутся — они в .env.
#
# Тексты сообщений — HTML-разметка, общая для Telegram и MAX:
#   <b>жирный</b>, <i>курсив</i>, <u>подчёркнутый</u>, <s>зачёркнутый</s>,
#   <code>моноширинный</code>, <a href="https://...">ссылка</a>.
# Символы < > & в обычном тексте пишите как &lt; &gt; &amp;.
# Тексты кнопок (*_button) — простой текст без разметки, до 64 символов.
# В фигурных скобках — подстановки, например {company}. Бот при запуске проверит,
# что в каждом тексте только допустимые подстановки (список — в README).

company:
  name: "Студия ремонта «Демо»"
  phone: "+7 (900) 000-00-00"     # показывается при отказе от согласия и при антиспаме

privacy:
  policy_url: "https://example.com/privacy"   # ссылка на политику обработки ПДн заказчика
  policy_version: "2026-09-01"               # версия/дата политики — сохраняется в каждой заявке

timezone: "Europe/Moscow"   # для /stats («сегодня») и времени в выгрузке

antispam:
  max_leads_per_hour: 3     # не больше N заявок с одного пользователя за 60 минут

dialog_ttl_hours: 24        # незаконченная заявка удаляется через столько часов
retention_days: 0           # хранить заявки N дней; 0 — не удалять автоматически

notifications:
  mask_phone: false         # true — в уведомлении номер скрыт: +7 999 ***-**-67

services:                   # id — латиница, цифры, _ и -, до 32 символов
  - id: turnkey
    title: "Ремонт под ключ"
  - id: cosmetic
    title: "Косметический ремонт"
  - id: bathroom
    title: "Санузел и плитка"
  - id: electric
    title: "Электрика"
  - id: design
    title: "Дизайн-проект"
  - id: other
    title: "Другое"

texts:
  consent: |-
    Здравствуйте! Это бот {company}. Здесь можно оставить заявку — мы перезвоним и ответим на вопросы.

    Для заявки понадобятся ваше имя и телефон. Нажимая «Согласен», вы даёте согласие на обработку этих данных для связи с вами по заявке в соответствии с <a href="{policy_url}">политикой обработки персональных данных</a>.
  policy_button: "Политика обработки данных"
  consent_accept_button: "Согласен"
  consent_decline_button: "Не согласен"
  consent_declined: |-
    Понимаем. Без согласия мы не можем принять заявку через бота, и ваши данные не сохранены.

    Позвоните нам: <b>{company_phone}</b>. Передумаете — нажмите /start.
  consent_required: "Сначала ответьте, пожалуйста, на вопрос о согласии — кнопками «Согласен» или «Не согласен» выше."

  choose_service: "Какая услуга вас интересует?"
  ask_name: "Как к вам обращаться?"
  invalid_name: "Напишите, пожалуйста, имя буквами — от {min_length} до {max_length} символов."
  ask_phone: |-
    Оставьте номер телефона для связи — нажмите кнопку «Отправить мой номер» или напишите его, например <code>+7 999 123-45-67</code>.
  share_contact_button: "Отправить мой номер"
  invalid_phone: "Не похоже на российский номер. Напишите в формате <code>+7 999 123-45-67</code> или <code>8 999 123 45 67</code>."
  phone_saved: "Записали номер {phone}."
  ask_comment: "Коротко опишите задачу или удобное время для звонка. Если добавить нечего — нажмите «Пропустить»."
  skip_button: "Пропустить"
  comment_too_long: "Слишком длинно — уложитесь, пожалуйста, в {max_length} символов."
  no_comment: "—"

  confirm: |-
    Проверьте заявку:

    <b>Услуга:</b> {service}
    <b>Имя:</b> {name}
    <b>Телефон:</b> {phone}
    <b>Комментарий:</b> {comment}
  send_button: "Отправить заявку"
  edit_button: "Заполнить заново"
  cancel_button: "Отменить"

  lead_accepted: |-
    Спасибо, {name}! Заявка <b>№{lead_id}</b> принята — перезвоним в рабочее время.

    Удалить свои данные можно командой /forget.
  rate_limited: |-
    Заявок от вас за последний час: {count} — мы их получили и скоро свяжемся.
    Новую заявку можно будет оставить через {minutes} мин. Если срочно — звоните: <b>{company_phone}</b>.
  cancelled: "Заявка отменена, данные не сохранены. Чтобы начать заново — /start."
  idle_hint: "Это бот {company} для заявок. Нажмите кнопку ниже или /start."
  start_button: "Оставить заявку"
  use_buttons: "Пожалуйста, выберите вариант кнопкой."
  stale_button: "Эта кнопка уже неактуальна. Начать заново — /start."
  data_deleted: "Готово: ваши данные удалены (заявок: {count}). Согласие на обработку отозвано."
  callback_ack: "Принято"
